name: 🐛 Bug Report
description: Report a problem or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this bug?
      options:
        - P0 - Critical (blocks release / production down)
        - P1 - High (major functionality broken)
        - P2 - Medium (workaround exists)
        - P3 - Low (minor / cosmetic)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser/runtime version, app version, etc.
      placeholder: e.g. Windows 11, Node 20, v1.2.3
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / screenshots
      description: Paste any relevant logs, stack traces, or screenshots. This will be automatically formatted as code.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues to make sure this bug hasn't already been reported
          required: true
        - label: I can reproduce this consistently
          required: false
